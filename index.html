<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificateur VIN - Campagnes Maxus</title>
<style>
  :root {
    --navy: #1E2761;
    --accent: #4472C4;
    --danger: #B3261E;
    --danger-bg: #FDECEA;
    --ok-bg: #EAF7EC;
    --ok: #1E7B34;
    --grey: #595959;
    --border: #D9DEE8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1c1c1c;
    background: #ffffff;
  }
  #app { padding: 14px 16px 18px; }
  .label {
    font-size: 14px; font-weight: 600; color: var(--navy);
    margin-bottom: 6px; display: block;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input#vinInput {
    flex: 1 1 220px;
    min-width: 160px;
    padding: 10px 12px;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input#vinInput:focus { border-color: var(--accent); }
  button#checkBtn {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--navy);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button#checkBtn:hover { background: var(--accent); }
  button#checkBtn:disabled { background: #9aa3c2; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--grey); margin-top: 5px; }
  #results { margin-top: 14px; }
  .card {
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .card.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #bfe6c6; }
  .card.recall { background: var(--danger-bg); border: 1.5px solid #e8968e; }
  .card.recall .code { font-weight: 700; color: var(--danger); }
  .card.service { background: #FFF7E6; border: 1px solid #ffd9a0; }
  .card.service .code { font-weight: 700; color: #8a5a00; }
  .card .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.4px; padding: 2px 8px; border-radius: 10px;
    margin-right: 7px; vertical-align: middle; color: #fff;
  }
  .card.recall .badge { background: var(--danger); }
  .card.service .badge { background: #B7791F; }
  .card.recall .desc, .card.service .desc { color: #333; margin-top: 3px; }
  .card.recall a, .card.service a {
    display: inline-block; margin-top: 6px; font-size: 12.5px;
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .card.recall a:hover, .card.service a:hover { text-decoration: underline; }
  .card.error { background: #FFF4E5; border: 1px solid #ffd9a0; color: #7a4a00; }
  .footer-note { margin-top: 10px; font-size: 11px; color: #9aa0ab; }
</style>
</head>
<body>
<div id="app">
  <span class="label">Verification VIN - campagnes / bulletins techniques actifs</span>
  <div class="row">
    <input id="vinInput" type="text" maxlength="17" placeholder="Ex : LSH14J4C0RV120688" autocomplete="off" spellcheck="false">
    <button id="checkBtn" type="button">Verifier</button>
  </div>
  <div class="hint">Saisissez les 17 caracteres du VIN puis cliquez sur Verifier.</div>
  <div id="results"></div>
  <div class="footer-note" id="footerNote"></div>
</div>

// Index VIN -> liste de campagnes pour une recherche instantanee
var VIN_INDEX = {};
(function build() {
  VIN_DATA.campaigns.forEach(function (c) {
    c.vins.forEach(function (v) {
      if (!VIN_INDEX[v]) VIN_INDEX[v] = [];
      VIN_INDEX[v].push(c);
    });
  });
})();

var VIN_RE = /^[A-HJ-NPR-Z0-9]{17}$/;
var input = document.getElementById('vinInput');
var btn = document.getElementById('checkBtn');
var results = document.getElementById('results');
var footerNote = document.getElementById('footerNote');

var totalVins = VIN_DATA.campaigns.reduce(function (n, c) { return n + c.vins.length; }, 0);
footerNote.textContent = 'Base mise a jour le ' + (VIN_DATA.updated || '?') +
  ' - ' + VIN_DATA.campaigns.length + ' campagnes actives, ' + totalVins + ' VIN references.';

function sortByType(matches) {
  // Campagnes de RAPPEL affichees en premier (plus prioritaires que le service)
  return matches.slice().sort(function (a, b) {
    if (a.type === b.type) return 0;
    return a.type === 'rappel' ? -1 : 1;
  });
}

function summarize(sortedMatches) {
  return sortedMatches.map(function (c) {
    return c.code + ' [' + (c.type === 'rappel' ? 'RAPPEL' : 'SERVICE') + ']';
  }).join(', ');
}

function sendToJotform(summary) {
  try {
    if (window.JFCustomWidget) {
      JFCustomWidget.sendData({ value: summary, valid: true });
    }
  } catch (e) { /* widget SDK non disponible (ex: apercu hors JotForm) */ }
}

function resize() {
  try {
    if (window.JFCustomWidget) {
      JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 10 });
    }
  } catch (e) {}
}

function render(vin, matches, invalid) {
  results.innerHTML = '';

  if (invalid) {
    var err = document.createElement('div');
    err.className = 'card error';
    err.textContent = 'Format VIN invalide : 17 caracteres attendus (lettres et chiffres, sans I, O, Q).';
    results.appendChild(err);
    sendToJotform('VIN=' + vin + ' | Format invalide');
    resize();
    return;
  }

  if (!matches.length) {
    var ok = document.createElement('div');
    ok.className = 'card ok';
    ok.textContent = 'Aucune campagne active trouvee pour le VIN ' + vin + '.';
    results.appendChild(ok);
    sendToJotform('VIN=' + vin + ' | Aucune campagne active');
  } else {
    var sorted = sortByType(matches);
    sorted.forEach(function (c) {
      var isRecall = c.type === 'rappel';
      var card = document.createElement('div');
      card.className = 'card ' + (isRecall ? 'recall' : 'service');
      var codeEl = document.createElement('div');
      codeEl.className = 'code';
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = isRecall ? 'RAPPEL' : 'SERVICE';
      codeEl.appendChild(badge);
      codeEl.appendChild(document.createTextNode(
        (isRecall ? '⚠ Campagne de rappel active : ' : 'Campagne de service active : ') + c.code
      ));
      card.appendChild(codeEl);
      if (c.desc) {
        var descEl = document.createElement('div');
        descEl.className = 'desc';
        descEl.textContent = c.desc;
        card.appendChild(descEl);
      }
      if (c.url) {
        var a = document.createElement('a');
        a.href = c.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Voir le bulletin technique ->';
        card.appendChild(a);
      }
      results.appendChild(card);
    });
    sendToJotform('VIN=' + vin + ' | ACTIF: ' + summarize(sorted));
  }
  resize();
}

function doCheck() {
  var vin = (input.value || '').trim().toUpperCase().replace(/\s+/g, '');
  input.value = vin;
  if (!VIN_RE.test(vin)) {
    render(vin, [], true);
    return;
  }
  var matches = VIN_INDEX[vin] || [];
  render(vin, matches, false);
}

btn.addEventListener('click', doCheck);
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); doCheck(); }
});
input.addEventListener('input', function () {
  input.value = input.value.toUpperCase();
});

// ---- Integration JotForm Widget SDK ----
if (window.JFCustomWidget) {
  JFCustomWidget.subscribe('ready', function () {
    try {
      var settings = JFCustomWidget.getWidgetSettings ? JFCustomWidget.getWidgetSettings() : null;
    } catch (e) {}
    resize();
  });
  JFCustomWidget.subscribe('submit', function () {
    var vin = (input.value || '').trim().toUpperCase();
    if (!vin) {
      JFCustomWidget.sendSubmit({ value: '', valid: true });
      return;
    }
    var matches = VIN_INDEX[vin] || [];
    var sorted = sortByType(matches);
    var value = sorted.length
      ? 'VIN=' + vin + ' | ACTIF: ' + summarize(sorted)
      : 'VIN=' + vin + ' | Aucune campagne active';
    JFCustomWidget.sendSubmit({ value: value, valid: true });
  });
}

resize();
</script>
